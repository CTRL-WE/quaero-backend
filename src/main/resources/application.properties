# ============================================
# QUAERO Backend Configuration
# Spring Boot 4.1.0
# ============================================

# --------------------------------------------
# Application
# --------------------------------------------
spring.application.name=quaero-backend

# --------------------------------------------
# Server
# --------------------------------------------
server.port=8080

# --------------------------------------------
# MySQL Database
# --------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/quaero_db
spring.datasource.username=root
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------
# JPA / Hibernate
# --------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------
# Flyway
# --------------------------------------------
spring.flyway.enabled=true

# --------------------------------------------
# JWT Configuration
# --------------------------------------------
jwt.secret=${JWT_SECRET:local-dev-secret-please-override-in-every-real-environment}
jwt.issuer=quaero-backend
jwt.access-token-expiration=86400000

# --------------------------------------------
# Logging
# --------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.ctrlwe.quaero=DEBUG

# --------------------------------------------
# Gemini AI Configuration
# --------------------------------------------
gemini.api-key=${gemini.api-key}
gemini.model=gemini-2.0-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout=30
